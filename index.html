<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<title>Mercado do Pai</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <h1>🛒 Mercado do Pai</h1>
  <p id="data" class="data">Carregando preços…</p>
  <nav class="abas">
    <button id="aba-lista" class="aba ativa" aria-pressed="true">📝 Minha lista</button>
    <button id="aba-ofertas" class="aba" aria-pressed="false">🔥 Ofertas do dia</button>
  </nav>
</header>
<main id="conteudo" aria-live="polite"></main>
<dialog id="comparar" aria-labelledby="c-nome">
  <div class="c-icone" id="c-icone"></div>
  <h2 id="c-nome"></h2>
  <div id="c-precos" class="c-precos"></div>
  <p id="c-frase" class="c-frase"></p>
  <button id="c-tirar" class="botao grande vermelho">Tirar da lista</button>
  <button id="c-fechar" class="botao grande claro">Fechar</button>
</dialog>
<dialog id="por" aria-labelledby="p-titulo">
  <h2 id="p-titulo">Pôr na lista</h2>
  <input id="p-busca" type="text" placeholder="Digite: arroz, ovos…" autocomplete="off" aria-label="Nome do produto">
  <div id="p-sugestoes" class="sugestoes"></div>
  <button id="p-fechar" class="botao grande claro">Fechar</button>
</dialog>
<dialog id="nova-lista" aria-labelledby="n-titulo">
  <h2 id="n-titulo">Começar lista nova?</h2>
  <p class="c-frase">Os riscos somem e a lista volta inteira.</p>
  <button id="n-sim" class="botao grande verde">Sim, lista nova</button>
  <button id="n-nao" class="botao grande claro">Não</button>
</dialog>
<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
